ipam:
  mode: kubernetes

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

# Hubble TLS certs are generated in-cluster by a Job instead of at `helm template`
# time. Helm's default `genSelfSignedCert` produces fresh certs on every render,
# which makes the rendered manifest (and thus the Talos machine_configuration_hash)
# change on every plan/apply. `cronJob` keeps the template deterministic.
hubble:
  tls:
    auto:
      method: cronJob
